# Workspace members. Add further entries as they are created.
packages:
  - apps/*
  - packages/*
  # tools/route-task is deliberately NOT a workspace member. It uses npm with its
  # own package-lock.json and `node --test`, and pnpm, Turborepo and the CI
  # workflow do not run it. Keep it out of the globs above.
  - "!tools/**"

# Supply-chain controls (pnpm 12). A version must be at least 1 day (1440 minutes,
# the pnpm default, set explicitly) old before it can be installed. The plan suggested
# 4320 (3 days), but its own prettier 3.9.10 pin was published 2026-10-10, so raise
# this to 4320 in a later dependency PR. pnpm may append minimumReleaseAgeExclude
# entries on its own; review this file in every dependency change and remove them.
minimumReleaseAge: 1440

# Dependency lifecycle scripts do not run unless listed here, and an unlisted
# build fails the install. Reviewed entry by entry.
strictDepBuilds: true
allowBuilds:
  # Pulled in by convex for bundling. Its postinstall only checks or relinks the
  # platform binary, which pnpm already installs as an @esbuild/* optional
  # dependency, so the script stays disabled.
  esbuild: false
  # Pulled in by eslint-config-next (through eslint-import-resolver-typescript). Its
  # postinstall (napi-postinstall) only checks or fetches the platform binary, which
  # pnpm already installs as an @unrs/resolver-binding-* optional dependency, so the
  # script stays disabled.
  unrs-resolver: false
  # The next three are reached through @clerk/expo (D-043 onward). Each script was
  # read before listing it here. browser-tabs-lock (through @clerk/clerk-js) prints
  # a thank-you banner from its postinstall and does nothing else. core-js (through
  # @clerk/clerk-js) prints a funding banner from its postinstall and does nothing
  # else. fsevents (macOS only, through Metro and Jest file watching) ships a
  # prebuilt fsevents.node; its install script is npm's implicit `node-gyp rebuild`
  # for packages with a binding.gyp, which would only recompile that binary.
  browser-tabs-lock: false
  core-js: false
  fsevents: false
