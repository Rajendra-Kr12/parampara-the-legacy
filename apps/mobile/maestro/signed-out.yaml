# Step 4a device smoke: a fresh install launches and shows the signed-out state.
# Run by .github/workflows/mobile-e2e.yml with `-e PLATFORM=ios|android`.
appId: dev.parampara.provisional
---
- launchApp:
    clearState: true
# Captured before the wait so a failing run still uploads the launch state (Maestro also
# writes a screenshot at the point of failure under ~/.maestro/tests, collected by CI).
- takeScreenshot: launch-${PLATFORM}
- extendedWaitUntil:
    visible: "You are signed out."
    timeout: 90000
- assertNotVisible:
    id: "my-name"
- assertNotVisible:
    id: "config-error"
- takeScreenshot: signed-out-${PLATFORM}
