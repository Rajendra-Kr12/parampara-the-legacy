# Device proofs for apps/mobile (Feature 1 Step 4a; D-043 onward). Each job builds a
# standalone Release app with embedded JavaScript (no Metro, no Expo Go, no dev
# client), launches it on a simulator or emulator, and runs the Maestro signed-out
# smoke. Dispatched by hand only. It needs two public repository variables,
# EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY and EXPO_PUBLIC_CONVEX_URL (public by design),
# and no secrets. Native folders are generated here by `expo prebuild` and never
# committed.
name: mobile-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  EXPO_NO_TELEMETRY: "1"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  # Maestro CLI from its GitHub release, checked against the release's
  # checksums_sha256.txt, never `curl | bash`.
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_SHA256: "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Require the public repository variables
        run: |
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$EXPO_PUBLIC_CONVEX_URL" ]; then
            echo "::error::Set the repository variables EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY and EXPO_PUBLIC_CONVEX_URL."
            exit 1
          fi
      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build the Release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start an API 34 emulator from the runner's Android SDK
        run: |
          image="system-images;android-34;google_apis;x86_64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$image" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$image" -d pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
      - name: Run the signed-out smoke
        run: |
          adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p e2e-artifacts
          cd e2e-artifacts
          maestro test -e PLATFORM=android --format junit --output junit-android.xml \
            ../apps/mobile/maestro/signed-out.yaml
      - name: Record the device
        if: always()
        run: |
          mkdir -p e2e-artifacts
          {
            echo "### Android"
            echo "- device: $(adb shell getprop ro.product.model | tr -d '\r')"
            echo "- API level: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "- expo: $(node -p "require('./apps/mobile/node_modules/expo/package.json').version")"
          } | tee e2e-artifacts/device-android.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-e2e-android
          path: e2e-artifacts
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Maestro needs Java on macOS too.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Require the public repository variables
        run: |
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$EXPO_PUBLIC_CONVEX_URL" ]; then
            echo "::error::Set the repository variables EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY and EXPO_PUBLIC_CONVEX_URL."
            exit 1
          fi
      - name: Generate the native project and install pods
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --clean
      - name: Build the Release app for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Parampara.xcworkspace -scheme Parampara -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Boot an iPhone simulator
        run: |
          # Pick an iPhone on the newest available iOS runtime and keep that runtime's
          # iOS version, so the device record names the OS that was actually tested.
          read -r udid ios_version < <(python3 -c '
          import json, sys
          runtimes = json.loads(sys.argv[1])["runtimes"]
          devices = json.loads(sys.argv[2])["devices"]
          versions = {r["identifier"]: r["version"] for r in runtimes if r.get("platform") == "iOS"}
          key = lambda runtime: tuple(int(part) for part in versions[runtime].split("."))
          for runtime in sorted((r for r in devices if r in versions), key=key, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"], versions[runtime]); sys.exit(0)
          sys.exit("no available iPhone simulator")' \
            "$(xcrun simctl list -j runtimes)" "$(xcrun simctl list -j devices available)")
          if [ -z "$udid" ] || [ -z "$ios_version" ]; then
            echo "::error::No available iPhone simulator on an iOS runtime."
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "SIM_IOS_VERSION=$ios_version" >> "$GITHUB_ENV"
      - name: Run the signed-out smoke
        run: |
          xcrun simctl install "$SIM_UDID" apps/mobile/ios/build/Build/Products/Release-iphonesimulator/Parampara.app
          mkdir -p e2e-artifacts
          cd e2e-artifacts
          maestro --device "$SIM_UDID" test -e PLATFORM=ios --format junit --output junit-ios.xml \
            ../apps/mobile/maestro/signed-out.yaml
      - name: Record the device
        if: always()
        run: |
          mkdir -p e2e-artifacts
          {
            echo "### iOS"
            echo "- simulator: $(xcrun simctl list devices | grep "${SIM_UDID:-none}" | sed 's/^ *//')"
            echo "- iOS: ${SIM_IOS_VERSION:-unknown}"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- expo: $(node -p "require('./apps/mobile/node_modules/expo/package.json').version")"
          } | tee e2e-artifacts/device-ios.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-e2e-ios
          path: e2e-artifacts
          if-no-files-found: warn
