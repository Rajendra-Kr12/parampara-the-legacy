# CI scope: the pnpm workspace (root tooling and packages/*), the secrets gate, and
# tools/route-task. route-task uses npm with its own package-lock.json and `node --test`
# and is excluded from pnpm-workspace.yaml, so it has its own job below.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Next.js ignores DO_NOT_TRACK; turbo.json passes this through to tasks.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # One job per check. The job names (format, lint, typecheck, test, build) are the
  # status-check contexts to require on the protect-main ruleset later.
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [format, lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.task }}

  # Secrets gate: fails when a tracked file is a .env* file (other than .env.example)
  # or contains an obvious secret. Same script as the opt-in local pre-commit hook.
  # Needs no install: scripts/check-secrets.mjs uses only Node built-ins.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-secrets.mjs

  # Laya data-flow check: the route-task tests prove a task that looks like a secret,
  # .env content, or personal data is refused before the key is loaded or Laya is called.
  route-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/route-task/package-lock.json
      - run: npm --prefix tools/route-task ci
      - run: npm --prefix tools/route-task test

  # Non-blocking code-health report (Fallow, pinned devDependency). This job can
  # never fail a pull request: continue-on-error on the job, `|| true` on every
  # analysis step, and it is not a required status check. Results render as the
  # job summary. It inherits the workflow-level contents: read permissions,
  # which are least privilege; the workflow probe does not allow job-level
  # permissions yet. .fallowrc.json keeps **/convex/_generated/** out of every
  # report as a guard against strict-mode false positives on Convex builder exports.
  fallow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      DO_NOT_TRACK: "1"
      FALLOW_TELEMETRY_DISABLED: "1"
      FALLOW_UPDATE_CHECK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Fallow warns that results degrade without node_modules, so it runs after install.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec fallow dead-code --format markdown >> "$GITHUB_STEP_SUMMARY" || true
      - run: pnpm exec fallow dupes --format markdown >> "$GITHUB_STEP_SUMMARY" || true
